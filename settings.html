<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Settings</title>
	<link rel="icon" type="image/png" href="./assets/Icon.png">
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
		}

		html,
		body {
			width: 100%;
			height: 100%;
		}

		body {
			display: grid;
			place-items: center;
			padding: 20px;
			background: #070a12;
			color: #fff;
			font-family: system-ui, sans-serif;
		}

		main {
			display: grid;
			gap: 12px;
			width: min(680px, 100%);
		}

		h1 {
			font-size: 1.6rem;
			text-align: center;
		}

		.setting {
			display: grid;
			grid-template-columns: 140px 1fr;
			align-items: center;
			min-height: 52px;
			padding: 12px 18px;
			border: 1px solid #fff;
			font-size: 1.1rem;
			font-weight: 600;
		}

		input {
			width: 100%;
			cursor: pointer;
			accent-color: #fff;
		}

		.color-slider {
			appearance: none;
			height: 14px;
			border: 1px solid #fff;
			background: linear-gradient(
				90deg,
				#000 0%,
				#f00 7.14%,
				#ff0 21.43%,
				#0f0 35.71%,
				#0ff 50%,
				#00f 64.29%,
				#f0f 78.57%,
				#f00 92.86%,
				#fff 100%
			);
		}

		.color-slider::-webkit-slider-thumb {
			width: 18px;
			height: 26px;
			border: 2px solid #fff;
			border-radius: 0;
			appearance: none;
			background: var(--thumb-color);
		}

		.color-slider::-moz-range-thumb {
			width: 16px;
			height: 24px;
			border: 2px solid #fff;
			border-radius: 0;
			background: var(--thumb-color);
		}

		.color-slider::-moz-range-track {
			background: transparent;
		}

		button {
			min-height: 52px;
			border: 1px solid #fff;
			background: #fff;
			color: #071018;
			font: inherit;
			font-weight: 600;
			cursor: pointer;
		}

		button[aria-pressed="false"] {
			background: transparent;
			color: #fff;
		}

		.setting-buttons {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 12px;
		}
	</style>
</head>
<body>
	<main>
		<h1>Settings</h1>
		<label class="setting">
			<span>Volume</span>
			<input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.5">
		</label>
		<label class="setting">
			<span>Block Color</span>
			<input class="color-slider" id="block-color" type="range" min="0" max="420" value="30">
		</label>
		<label class="setting">
			<span>Player Color</span>
			<input class="color-slider" id="player-color" type="range" min="0" max="420" value="0">
		</label>
		<div class="setting-buttons">
			<button id="speed-button" type="button">Speed: 5</button>
			<button id="repulsion-button" type="button" aria-pressed="false">Window Repulsion: Off</button>
		</div>
	</main>

	<script>
		const volumeSlider = document.querySelector("#volume-slider");
		const blockColor = document.querySelector("#block-color");
		const playerColor = document.querySelector("#player-color");
		const speedButton = document.querySelector("#speed-button");
		const repulsionButton = document.querySelector("#repulsion-button");
		const speeds = [3, 5, 8];
		let repulsionEnabled = false;
		let speed = 5;

		function send(message) {
			window.opener?.postMessage(message, window.location.origin);
		}

		function showRepulsionState() {
			repulsionButton.textContent = `Window Repulsion: ${repulsionEnabled ? "On" : "Off"}`;
			repulsionButton.setAttribute("aria-pressed", String(repulsionEnabled));
		}

		function getColor(value) {
			if (value < 30) return `hsl(0 100% ${value / 30 * 50}%)`;
			if (value <= 390) return `hsl(${value - 30} 100% 50%)`;

			const white = (value - 390) / 30;
			return `hsl(0 ${100 - white * 100}% ${50 + white * 50}%)`;
		}

		function showColor(slider) {
			slider.style.setProperty("--thumb-color", getColor(Number(slider.value)));
		}

		window.addEventListener("message", (event) => {
			if (
				event.origin !== window.location.origin ||
				event.source !== window.opener ||
				event.data.type !== "settings-state"
			) return;

			volumeSlider.value = event.data.volume;
			blockColor.value = event.data.block;
			playerColor.value = event.data.player;
			speed = event.data.speed;
			repulsionEnabled = event.data.repulsionEnabled;
			speedButton.textContent = `Speed: ${speed}`;
			showColor(blockColor);
			showColor(playerColor);
			showRepulsionState();
		});

		volumeSlider.addEventListener("input", () => {
			send({type: "settings-volume", value: Number(volumeSlider.value)});
		});

		blockColor.addEventListener("input", () => {
			showColor(blockColor);
			send({type: "settings-color", name: "block", value: Number(blockColor.value)});
		});

		playerColor.addEventListener("input", () => {
			showColor(playerColor);
			send({type: "settings-color", name: "player", value: Number(playerColor.value)});
		});

		repulsionButton.addEventListener("click", () => {
			repulsionEnabled = !repulsionEnabled;
			showRepulsionState();
			send({type: "settings-repulsion", enabled: repulsionEnabled});
		});

		speedButton.addEventListener("click", () => {
			speed = speeds[(speeds.indexOf(speed) + 1) % speeds.length];
			speedButton.textContent = `Speed: ${speed}`;
			send({type: "settings-speed", speed});
		});

		showColor(blockColor);
		showColor(playerColor);
		send({type: "settings-ready"});

		setInterval(() => {
			if (!window.opener || window.opener.closed) window.close();
		}, 250);
	</script>
</body>
</html>
