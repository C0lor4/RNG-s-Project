<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sneaky Switch</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		body {
			display: grid;
			place-items: center;
			background: #070a12;
			font-family: system-ui, sans-serif;
		}

		.start-title {
			position: fixed;
			top: 48px;
			color: #fff;
			font-size: 6rem;
			letter-spacing: 0.02em;
		}

		.start-options {
			display: grid;
			gap: 24px;
			width: min(420px, calc(100vw - 48px));
		}

		.start-button {
			min-height: 68px;
			padding: 18px 28px;
			border: 1px solid #fff;
			background: transparent;
			color: #fff;
			font-size: 1.25rem;
			font-weight: 600;
			cursor: pointer;
		}

		.start-button:hover,
		.start-button:focus-visible {
			background: #fff;
			color: #071018;
		}

		.difficulty-options {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 12px;
		}

		.difficulty-options[hidden] {
			display: none;
		}

		.volume-control {
			display: grid;
			grid-template-columns: 90px 1fr;
			align-items: center;
			min-height: 68px;
			padding: 18px 28px;
			border: 1px solid #fff;
			color: #fff;
			font-size: 1.25rem;
			font-weight: 600;
		}

		.volume-control input {
			width: 100%;
			cursor: pointer;
			accent-color: #fff;
		}
	</style>
</head>
<body>
	<h1 class="start-title">Sneaky Switch</h1>
	<main class="start-options">
		<button class="start-button" id="start-button" type="button">Start</button>
		<button class="start-button" id="difficulty-button" type="button" aria-expanded="false">Difficulty</button>
		<div class="difficulty-options" id="difficulty-options" hidden>
			<button class="start-button" id="maze-size-button" type="button">33x25</button>
			<button class="start-button" id="piece-count-button" type="button">8</button>
		</div>
		<label class="volume-control">
			<span>Volume</span>
			<input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.5">
		</label>
		<button class="start-button" id="close-button" type="button">Close</button>
	</main>
	<script type="module" src="Setup.js"></script>
</body>
</html>
