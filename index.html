<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Window Maze</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		body {
			display: grid;
			place-items: center;
			background: #070a12;
			font-family: system-ui, sans-serif;
		}

		.start-title {
			position: fixed;
			top: 48px;
			left: 50%;
			transform: translateX(-50%);
			color: #fff;
			font-size: clamp(2.5rem, 7vw, 5rem);
			letter-spacing: 0.08em;
			white-space: nowrap;
		}

		.start-options {
			display: grid;
			gap: 24px;
			width: min(420px, calc(100vw - 48px));
		}

		.start-button {
			min-height: 68px;
			padding: 18px 28px;
			border: 1px solid #fff;
			background: transparent;
			color: #fff;
			font-size: 1.25rem;
			font-weight: 600;
			cursor: pointer;
		}

		.start-button:hover,
		.start-button:focus-visible {
			background: #fff;
			color: #071018;
		}

		.volume-control {
			display: grid;
			grid-template-columns: 90px 1fr;
			align-items: center;
			min-height: 68px;
			padding: 18px 28px;
			border: 1px solid #fff;
			color: #fff;
			font-size: 1.25rem;
			font-weight: 600;
		}

		.volume-control input {
			width: 100%;
			cursor: pointer;
			accent-color: #fff;
		}
	</style>
</head>
<body>
	<h1 class="start-title">Window Maze</h1>
	<main class="start-options">
		<button class="start-button" id="start-button" type="button">Start</button>
		<button class="start-button" id="reset-button" type="button">Reset</button>
		<label class="volume-control">
			<span>Volume</span>
			<input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.5">
		</label>
	</main>
	<script type="module" src="Setup.js"></script>
</body>
</html>
